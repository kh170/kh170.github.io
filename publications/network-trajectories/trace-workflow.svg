
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="550" viewBox="0 0 1120 550" role="img" aria-labelledby="title desc">
<title id="title">How TRACE predicts a next homelessness-service transition</title>
<desc id="desc">Three steps: represent an observed service history, compare it with network-aware historical trajectories using durations and connections, and predict a next service type or exit. Illustrative only, not actual participant trajectories or probabilities.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fcff"/><stop offset="1" stop-color="#e9f4ff"/></linearGradient>
 <linearGradient id="blue" x2="0" y2="1"><stop stop-color="#276fb2"/><stop offset="1" stop-color="#0d4f89"/></linearGradient>
 <filter id="sh"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1b5679" flood-opacity=".08"/></filter>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" stroke="#7293af" fill="none" stroke-width="1.8"/></marker>
 <style>
  text{font-family: 'DejaVu Sans',Arial,sans-serif}
  .heading{font-size:23px;font-weight:700;fill:#143a5c}
  .note{font-size:18px;fill:#5d7890}
  .label{font-size:20px;font-weight:700;fill:#234765}
  .sub{font-size:16px;fill:#57758f}
  .tag{font-size:17px;font-weight:700;fill:#225b89}
  .white{fill:white}
 </style>
</defs>
<rect width="1120" height="550" rx="22" fill="url(#bg)"/>
<g font-family="Arial,sans-serif"><text x="48" y="58" class="heading">From recorded pathways to a next-step prediction</text><text x="48" y="90" class="note">TRACE combines the service network, sequence history and time spent in services.</text></g>
<!-- Three diagram stages -->
<rect x="37" y="136" width="323" height="347" rx="19" fill="white" stroke="#cfe4f5" filter="url(#sh)"/>
<rect x="400" y="136" width="323" height="347" rx="19" fill="white" stroke="#cfe4f5" filter="url(#sh)"/>
<rect x="763" y="136" width="320" height="347" rx="19" fill="white" stroke="#cfe4f5" filter="url(#sh)"/>
<g>
 <circle cx="69" cy="170" r="18" fill="#e0efff"/><text x="69" y="176" text-anchor="middle" class="tag">1</text>
 <text x="98" y="177" class="label">Observe a history</text>
 <text x="63" y="219" class="sub">Service visits in time order</text>
 <rect x="62" y="259" width="94" height="56" rx="13" fill="#d8edff" stroke="#76b3e7"/><text x="109" y="282" text-anchor="middle" font-size="16" font-weight="700" fill="#1e5988">Service</text><text x="109" y="302" text-anchor="middle" font-size="16" fill="#1e5988">A</text>
 <path d="M158 287 H193" stroke="#77a0bc" stroke-width="2" marker-end="url(#arrow)"/>
 <rect x="202" y="259" width="120" height="56" rx="13" fill="#d8edff" stroke="#76b3e7"/><text x="262" y="282" text-anchor="middle" font-size="16" font-weight="700" fill="#1e5988">Service</text><text x="262" y="302" text-anchor="middle" font-size="16" fill="#1e5988">B</text>
 <rect x="74" y="352" width="244" height="59" rx="12" fill="#f1f8ff"/><text x="196" y="375" class="sub" text-anchor="middle">Recorded entry, exit</text><text x="196" y="395" class="sub" text-anchor="middle">and stay durations</text>
</g>
<g>
 <circle cx="431" cy="170" r="18" fill="#e0efff"/><text x="431" y="176" text-anchor="middle" class="tag">2</text>
 <text x="461" y="177" class="label">Compare pathways</text>
 <text x="426" y="218" class="sub">Find similar historical journeys</text>
 <circle cx="472" cy="283" r="30" fill="#d8edff" stroke="#2c83c1" stroke-width="2"/>
 <circle cx="638" cy="258" r="30" fill="#d8edff" stroke="#2c83c1" stroke-width="2"/>
 <circle cx="638" cy="361" r="30" fill="#d8edff" stroke="#2c83c1" stroke-width="2"/>
 <path d="M502 281 Q555 248 607 257" fill="none" stroke="#5996c2" stroke-width="3" marker-end="url(#arrow)"/>
 <path d="M500 300 Q559 364 607 362" fill="none" stroke="#5996c2" stroke-width="3" marker-end="url(#arrow)"/>
 <text x="472" y="288" class="tag" text-anchor="middle">A</text><text x="638" y="264" class="tag" text-anchor="middle">B</text><text x="638" y="367" class="tag" text-anchor="middle">C</text>
 <text x="558" y="423" text-anchor="middle" class="sub">Network distance +</text><text x="558" y="444" text-anchor="middle" class="sub">time overlap</text>
</g>
<g>
 <circle cx="795" cy="170" r="18" fill="#e0efff"/><text x="795" y="176" text-anchor="middle" class="tag">3</text>
 <text x="825" y="177" class="label">Predict next step</text>
 <text x="786" y="218" class="sub">Rank feasible transitions</text>
 <rect x="803" y="252" width="240" height="56" rx="14" fill="url(#blue)"/>
 <text x="923" y="276" text-anchor="middle" font-size="17" font-weight="700" fill="white">Next service</text><text x="923" y="295" text-anchor="middle" font-size="16" fill="white">type</text>
 <text x="923" y="347" text-anchor="middle" class="note">or</text>
 <rect x="803" y="366" width="240" height="57" rx="14" fill="#e9f7ef" stroke="#70b99b"/>
 <text x="923" y="401" text-anchor="middle" font-size="20" font-weight="700" fill="#2b8068">Exit system</text>
</g>
<path d="M365 312 H396" stroke="#7ca5c1" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M728 312 H758" stroke="#7ca5c1" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="50" y="520" class="sub">Conceptual illustration of the methodology; not observed trajectories or measured probabilities.</text>
</svg>
