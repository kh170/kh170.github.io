<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 265" role="img" aria-labelledby="tt dd"><title id="tt">Illustrative recorded service pathways</title><desc id="dd">Three example classifications showing a pathway that exits to stable housing, a pathway that returns to earlier services and has a nonstable recorded exit, and an incomplete record without a known exit destination.</desc>
<defs><style>.lab{font:700 13px 'DejaVu Sans',sans-serif;fill:#17446c}.sub{font:400 12px 'DejaVu Sans',sans-serif;fill:#5c7690}.arrow{stroke:#7eabc9;stroke-width:2.3;fill:none;stroke-linecap:round}.node{fill:#e8f4ff;stroke:#9fcbe8;stroke-width:1.6}.result{fill:#d1f1e4;stroke:#78bea3;stroke-width:1.6}.unknown{fill:#f2f2f8;stroke:#bbbdd6;stroke-width:1.6}</style><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7eabc9"/></marker></defs>
<rect width="860" height="265" fill="#f9fcff" rx="18"/>
<g transform="translate(18,16)"><text class="lab" x="5" y="22">Successful</text><text class="sub" x="5" y="40">Recorded stable exit</text><rect class="node" x="175" y="3" width="120" height="46" rx="12"/><text class="lab" x="201" y="31">Shelter</text><rect class="node" x="345" y="3" width="120" height="46" rx="12"/><text class="lab" x="363" y="31">Service</text><rect class="result" x="522" y="3" width="211" height="46" rx="12"/><text class="lab" x="545" y="31">Stable destination</text><path d="M295 26H342 M466 26H518" class="arrow" marker-end="url(#a)"/></g>
<g transform="translate(18,105)"><text class="lab" x="5" y="22">Unsuccessful</text><text class="sub" x="5" y="40">Repeated service use</text><rect class="node" x="175" y="3" width="120" height="46" rx="12"/><text class="lab" x="201" y="31">Shelter</text><rect class="node" x="345" y="3" width="120" height="46" rx="12"/><text class="lab" x="363" y="31">Service</text><rect class="unknown" x="522" y="3" width="211" height="46" rx="12"/><text class="lab" x="538" y="31">Nonstable destination</text><path d="M295 26H342 M466 26H518" class="arrow" marker-end="url(#a)"/><path d="M385 4 Q318 -39 231 0" class="arrow" marker-end="url(#a)"/></g>
<g transform="translate(18,194)"><text class="lab" x="5" y="22">Unrecorded exit</text><text class="sub" x="5" y="40">Destination unknown</text><rect class="node" x="175" y="3" width="120" height="46" rx="12"/><text class="lab" x="201" y="31">Shelter</text><rect class="node" x="345" y="3" width="120" height="46" rx="12"/><text class="lab" x="363" y="31">Service</text><rect class="unknown" x="522" y="3" width="211" height="46" rx="12" stroke-dasharray="5 4"/><text class="lab" x="549" y="31">No exit recorded</text><path d="M295 26H342 M466 26H518" class="arrow" marker-end="url(#a)"/></g>
</svg>