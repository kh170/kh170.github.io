<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 345" role="img" aria-labelledby="t d"><title id="t">From TRACE to MetaTier</title><desc id="d">A conceptual research workflow that starts with service histories, infers a service network, uses TRACE to predict less common service transitions, combines complementary exit and frequent-service predictions, and produces a MetaTier output.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#679abf"/></marker><style>.head{font:700 18px 'DejaVu Sans',sans-serif;fill:#15395d}.sub{font:400 13px 'DejaVu Sans',sans-serif;fill:#5c7890}.mini{font:700 11px 'DejaVu Sans',sans-serif;fill:#2a78ac}.box{fill:#f4f9ff;stroke:#c6e2f5;stroke-width:2}.arrow{stroke:#679abf;stroke-width:2;fill:none;marker-end:url(#arr)}.accent{fill:#deeffd;stroke:#78b3dc;stroke-width:2}</style></defs>
<rect width="860" height="345" rx="20" fill="#f9fcff"/>
<rect class="box" x="22" y="70" rx="16" width="178" height="103"/><text class="mini" x="40" y="97">INPUT</text><text class="head" x="40" y="124">Service</text><text class="head" x="40" y="148">histories</text><path class="arrow" d="M200 120 H244"/>
<rect class="box" x="247" y="70" rx="16" width="180" height="103"/><text class="mini" x="265" y="97">INFER</text><text class="head" x="265" y="124">Service</text><text class="head" x="265" y="148">network</text><path class="arrow" d="M427 120 H471"/>
<rect class="box" x="475" y="70" rx="16" width="180" height="103"/><text class="mini" x="492" y="97">LEARN</text><text class="head" x="492" y="124">TRACE</text><text class="sub" x="492" y="146">Next service</text>
<path class="arrow" d="M654 120 H684 V181"/>
<rect class="box" x="247" y="222" rx="16" width="180" height="88"/><text class="mini" x="265" y="247">COMPLEMENT</text><text class="head" x="265" y="273">Exit / frequent</text><text class="sub" x="265" y="291">service predictions</text><path class="arrow" d="M427 265 H680"/>
<rect class="accent" x="686" y="187" rx="16" width="151" height="122"/><text class="mini" x="703" y="211">COMBINE</text><text class="head" x="703" y="242">MetaTier</text><text class="sub" x="703" y="265">Final next-step</text><text class="sub" x="703" y="285">prediction</text>
<text class="sub" x="23" y="335">Conceptual workflow, not a reconstruction of individual-level data.</text>
</svg>